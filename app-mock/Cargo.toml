[package]
name = "app-mock"
version = "0.1.0"
edition = "2024"
description = "Desktop simulator for the embedded audio player UI"

[dependencies]
app-core = { path = "../app-core" }
embedded-graphics = "0.8"
embedded-graphics-simulator = "0.8"
embassy-executor = { version = "0.5", features = [
  "arch-std",
  "executor-thread",
  "integrated-timers",
] }
embassy-time = { version = "0.3", features = ["std"] }
embassy-sync = "0.5"
critical-section = { version = "1", features = ["std"] }
