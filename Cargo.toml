[workspace]
members = ["app-core", "app-firmware", "app-mock"]
resolver = "3"

[workspace.dependencies]
app-core = { path = "app-core" }
critical-section = "1"
defmt = "1"
defmt-rtt = "1.3"
embassy-executor = { version = "0.10", features = [
  "executor-thread",
] }
embassy-futures = "0.1"
embassy-stm32 = { version = "0.6", features = [
  "stm32h7a3vi",
  "time-driver-any",
] }
embassy-sync = "0.8"
embassy-time = "0.5"
embedded-alloc = "0.7"
embedded-graphics = "0.8"
embedded-graphics-simulator = "0.8"
embedded-sdmmc = "0.10"
heapless = "0.9"
symphonia = { version = "0.6", default-features = false, features = [
  "mp3",
  "flac",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = true      # Keep debug info for probe-rs even in release
